<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Food Planner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#7b8496;--accent:#6c63ff;--accent2:#8d7cff;--line:#e9ecf3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.app{max-width:560px;margin:auto;padding:18px 16px 28px}.hero{padding:24px 4px 18px}.eyebrow{font-size:13px;color:var(--accent);font-weight:800;letter-spacing:.08em;text-transform:uppercase}.title{font-size:32px;font-weight:850;margin:7px 0}.sub{color:var(--muted);line-height:1.45;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:17px;min-height:126px;box-shadow:0 7px 22px rgba(30,40,70,.06);text-align:left}.card.big{grid-column:1/-1;min-height:112px}.icon{font-size:27px}.ct{font-weight:800;font-size:17px;margin-top:10px}.cm{color:var(--muted);font-size:13px;margin-top:5px;line-height:1.35}.primary{margin-top:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;border:0;border-radius:18px;padding:16px;width:100%;font-size:16px;font-weight:800}.section{margin:22px 0 11px;font-size:15px;font-weight:850}.profile{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center}.avatar{width:44px;height:44px;border-radius:14px;background:#eee9ff;display:grid;place-items:center;font-size:22px}.small{font-size:12px;color:var(--muted)}button{font:inherit;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:11px;padding:22px 0 0}
</style>
</head>
<body>
<div class="app">
  <section class="hero">
    <div class="eyebrow">FOOD PLANNER</div>
    <div class="title">Твой рацион проще.</div>
    <p class="sub">Планируй питание, смотри блюда на сегодня и неделю, собирай покупки и используй ИИ-помощника.</p>
  </section>

  <div class="profile"><div class="avatar">🥗</div><div><b>Добро пожаловать!</b><div class="small">Все основные действия доступны прямо здесь.</div></div></div>

  <div class="section">Мой Food Planner</div>
  <div class="grid">
    <button class="card big" onclick="send('today')"><div class="icon">📅</div><div class="ct">Рацион на сегодня</div><div class="cm">Открыть готовый план в Telegram</div></button>
    <button class="card" onclick="send('week')"><div class="icon">📆</div><div class="ct">На неделю</div><div class="cm">План на 7 дней</div></button>
    <button class="card" onclick="send('shopping')"><div class="icon">🛒</div><div class="ct">Покупки</div><div class="cm">Список продуктов</div></button>
    <button class="card" onclick="send('replace')"><div class="icon">🔄</div><div class="ct">Заменить</div><div class="cm">Подобрать другое блюдо</div></button>
    <button class="card" onclick="send('favorites')"><div class="icon">❤️</div><div class="ct">Избранное</div><div class="cm">Любимые блюда</div></button>
    <button class="card" onclick="send('ai')"><div class="icon">🤖</div><div class="ct">Спросить ИИ</div><div class="cm">Рецепты и идеи</div></button>
  </div>

  <button class="primary" onclick="send('build')">🍽️ Составить новый рацион</button>
  <div class="footer">Food Planner • рацион без подсчёта калорий</div>
</div>
<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
function send(action){
  if(tg){tg.sendData(JSON.stringify({action}));}
  else{alert('Открой Mini App внутри Telegram.');}
}
</script>
</body>
</html>
